        theory: `
          <p class="mb-3">Behavioral modeling in Verilog is the highest level of abstraction for describing digital hardware. Instead of specifying logic gates or continuous dataflow equations, you describe what the circuit does algorithmically—similar to writing software in C—using procedural blocks.</p>
          <p class="mb-3"> <h2><strong>Core Procedural Blocks</strong></h2>
    <p>Behavioral code lives inside structured blocks that control when and how statements execute:</p>
    <ul>
        <li><strong><code>always</code> block:</strong> Executes continuously in a loop whenever a signal in its <strong>sensitivity list</strong> changes. Used for synthesizable hardware (both combinational and sequential logic).</li>
        <li><strong><code>initial</code> block:</strong> Executes only once at simulation start (<code>t = 0</code>). Used strictly for testbenches, stimulus generation, and variable initialization—<strong>not synthesizable</strong>.</li>
    </ul>

    <hr>

    <h2><strong>Procedural Assignments: Blocking vs. Non-Blocking</strong></h2>
    <p>Choosing the right assignment operator inside an <code>always</code> block is critical to avoiding race conditions and synthesis mismatches.</p>

    <table>
        <thead>
            <tr>
                <th>Feature</th>
                <th>Blocking (<code>=</code>)</th>
                <th>Non-Blocking (<code>&lt;</code>=)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>Execution</strong></td>
                <td>Sequential (evaluates and assigns immediately before the next line)</td>
                <td>Concurrent (evaluates all RHS expressions first, then updates LHS at the end of the time step)</td>
            </tr>
            <tr>
                <td><strong>Hardware Inferred</strong></td>
                <td>Combinational logic</td>
                <td>Sequential logic (Flip-Flops / Registers)</td>
            </tr>
            <tr>
                <td><strong>Use Case</strong></td>
                <td><code>always @(*)</code> combinational blocks</td>
                <td><code>always @(posedge clk)</code> clocked blocks</td>
            </tr>
        </tbody>
    </table>

    <hr>

    <h2>Common Behavioral Constructs</h2>
    <ul>
        <li>
            <strong>Conditional Statements:</strong> <code>if-else</code> and <code>case</code> (must be inside <code>always</code> or <code>initial</code> blocks).
            <ul>
                <li><em>Rule:</em> In combinational <code>always @(*)</code> blocks, ensure every <code>if</code> has an <code>else</code> and every <code>case</code> has a <code>default</code> to prevent unintended <strong>latches</strong>.</li>
            </ul>
        </li>
        <li><strong>Loops:</strong> <code>for</code>, <code>while</code>, <code>repeat</code>, and <code>forever</code>. (In synthesizable RTL, <code>for</code> loops must have static bounds so the synthesis tool can unroll them into hardware).</li>
        <li><strong>Data Types:</strong> Any signal assigned inside an <code>always</code> or <code>initial</code> block must be declared as <code>reg</code> (or <code>logic</code> in SystemVerilog), even if it synthesizes to a simple wire.</li>
    </ul>

    <hr>

    <h2>Practical Examples</h2>

    <h3>1. Combinational Logic (4-to-1 Multiplexer)</h3>
    <p>Uses <code>always @(*)</code> so the sensitivity list automatically tracks all inputs, paired with blocking (<code>=</code>) assignments.</p>

<pre><code><span class="keyword">module</span> mux_4to1 (
    <span class="keyword">input  wire</span> [<span class="number">3</span>:<span class="number">0</span>] d,
    <span class="keyword">input  wire</span> [<span class="number">1</span>:<span class="number">0</span>] sel,
    <span class="keyword">output reg</span>        y
);

    <span class="keyword">always</span> @(*) <span class="keyword">begin</span>
        <span class="keyword">case</span> (sel)
            <span class="number">2'b00</span>:   y = d[<span class="number">0</span>];
            <span class="number">2'b01</span>:   y = d[<span class="number">1</span>];
            <span class="number">2'b10</span>:   y = d[<span class="number">2</span>];
            <span class="number">2'b11</span>:   y = d[<span class="number">3</span>];
            <span class="keyword">default</span>: y = <span class="number">1'b0</span>; <span class="comment">// Prevents latch inference</span>
        <span class="keyword">endcase</span>
    <span class="keyword">end</span>

<span class="keyword">endmodule</span></code></pre>

    <h3>2. Sequential Logic (D Flip-Flop with Synchronous Reset)</h3>
    <p>Triggered on the positive clock edge, paired with non-blocking (<code>&lt;</code>=) assignments.</p>

<pre><code><span class="keyword">module</span> d_ff (
    <span class="keyword">input  wire</span> clk,
    <span class="keyword">input  wire</span> rst,
    <span class="keyword">input  wire</span> d,
    <span class="keyword">output reg</span>  q
);

    <span class="keyword">always</span> @(<span class="keyword">posedge</span> clk) <span class="keyword">begin</span>
        <span class="keyword">if</span> (rst)
            q &lt;&zwnj;= <span class="number"> 1'b0</span>;
        <span class="keyword">else</span>
            q &lt;&zwnj;= d;
    <span class="keyword">end</span>

<span class="keyword">endmodule</span></code></pre>
</div></p>
            `,

            language: "Verilog",
            code: `module jk_ff (
    input  wire clk,
    input  wire j,
    input  wire k,
    output reg  q,
    output wire q_bar
);

    // Continuous assignment for the inverted output
    assign q_bar = ~q;

    // Behavioral model triggered on the rising edge of the clock
    always @(posedge clk) begin
        case ({j, k})
            2'b00: q &lt;&zwnj;= q;      // No change (Hold state)
            2'b01: q &lt;&zwnj;= 1'b0;   // Reset state
            2'b10: q &lt;&zwnj;= 1'b1;   // Set state
            2'b11: q &lt;&zwnj;= ~q;     // Toggle state
        endcase
    end

endmodule`

        rst = 1'b0;
        #30;

        // End simulation

    end

endmodule`

        theory: `
          <p class="mb-3">A static <strong>CMOS Inverter</strong> consists of a pull-up <strong>PMOS</strong> transistor connected to <code>V<sub>DD</sub></code> and a pull-down <strong>NMOS</strong> transistor connected to <code>GND</code>, with their gates tied together as input <code>V<sub>in</sub></code> and drains tied together as output <code>V<sub>out</sub></code>.</p>
          <p class="mb-3">When <code>V<sub>in</sub> = 0 V</code>, the NMOS is in cutoff while the PMOS operates in the linear region, pulling <code>V<sub>out</sub></code> to <code>V<sub>DD</sub></code>. Conversely, when <code>V<sub>in</sub> = V<sub>DD</sub></code>, the NMOS turns ON and discharges the load capacitance <code>C<sub>L</sub></code> to <code>0 V</code>. Because one transistor is always OFF in steady state, static power dissipation is negligible.</p>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 my-4">
            <div class="bg-slate-900 text-emerald-300 p-3.5 rounded-xl font-mono text-xs border border-slate-700">
              <div class="text-slate-400 text-[11px] uppercase mb-1">Switching Threshold (V<sub>m</sub>)</div>
              V<sub>m</sub> = (V<sub>DD</sub> - |V<sub>tp</sub>| + V<sub>tn</sub>&radic;(k<sub>n</sub>/k<sub>p</sub>)) / (1 + &radic;(k<sub>n</sub>/k<sub>p</sub>))
            </div>
            <div class="bg-slate-900 text-cyan-300 p-3.5 rounded-xl font-mono text-xs border border-slate-700">
              <div class="text-slate-400 text-[11px] uppercase mb-1">Noise Margins & Propagation Delay</div>
              NM<sub>H</sub> = V<sub>OH</sub> - V<sub>IH</sub> &nbsp;|&nbsp; NM<sub>L</sub> = V<sub>IL</sub> - V<sub>OL</sub><br/>
              t<sub>p</sub> = (t<sub>pHL</sub> + t<sub>pLH</sub>) / 2
            </div>
          </div>
          <p>To achieve symmetric VTC (<code>V<sub>m</sub> &approx; V<sub>DD</sub>/2</code>) and equal rise/fall delays, the PMOS width is typically sized <strong>2&times; to 2.5&times;</strong> wider than the NMOS width (<code>W<sub>p</sub> &approx; 2.5 W<sub>n</sub></code>) to compensate for lower hole mobility (&mu;<sub>p</sub> &lt; &mu;<sub>n</sub>).</p>

          <ul class="list-disc pl-5 space-y-1.5 mb-3">
            <li><strong>2-Input CMOS NAND:</strong> Two PMOS transistors in <em>parallel</em> (PUN) and two NMOS transistors in <em>series</em> (PDN). Since two series NMOS transistors double the pull-down resistance, each NMOS width is doubled (<code>W<sub>n</sub> = 2 &times; W<sub>n,inv</sub></code>) while each PMOS retains unit width (<code>W<sub>p</sub> = W<sub>p,inv</sub></code>).</li>

    input  wire [7:0] a,
    input  wire [7:0] b,
    input  wire [2:0] opcode,
    output reg  [7:0] y,
    output reg        cout,
    output wire       zero
);

    always @(*) begin
        cout = 1'b0;
        case (opcode)
            3'b000: {cout, y} = a + b;        // ADD
            3'b001: {cout, y} = a - b;        // SUB
            3'b010: y = a & b;                // Bitwise AND
            3'b011: y = a | b;                // Bitwise OR
            3'b100: y = a ^ b;                // Bitwise XOR
            3'b101: y = ~a;                   // Bitwise NOT
            3'b110: {cout, y} = {a, 1'b0};    // Shift Left
            3'b111: {y, cout} = {1'b0, a};    // Shift Right
            default: y = 8'h00;
        endcase
    end

    assign zero = (y == 8'h00);
endmodule`

            code: `module seq_detector_1011 (
    input  wire clk,
    input  wire rst_n,
    input  wire din,
    output reg  dout
);
    localparam [1:0] S0 = 2'b00, S1 = 2'b01, S2 = 2'b10, S3 = 2'b11;
    reg [1:0] state, next_state;

    // 1. Sequential State Register
    always @(posedge clk or negedge rst_n) begin
        if (!rst_n) state <= S0;
        else        state <= next_state;
    end

    // 2. Combinational Next-State & Output Logic (Mealy)
    always @(*) begin
        next_state = state;
        dout       = 1'b0;
        case (state)
            S0: next_state = din ? S1 : S0;
            S1: next_state = din ? S1 : S2;
            S2: next_state = din ? S3 : S0;
            S3: begin
                if (din) begin
                    next_state = S1; // Overlapping '1'
                    dout       = 1'b1;
                end else
                    next_state = S2;
            end
        endcase
    end
endmodule`

    // =========================================================================

    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass = type === 'success'
        ? 'bg-slate-900 text-white border-emerald-500'
        : 'bg-slate-900 text-white border-cyan-500';

      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border-l-4 shadow-xl text-xs font-medium fade-in ${bgClass}`;
      toast.innerHTML = `
        <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-cyan-400'} text-sm"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }

    function copyCodeSnippet(expId, snippetIdx = 0) {
      const exp = EXPERIMENTS.find(e => e.id === expId);
      if (!exp || !exp.codeSnippets || !exp.codeSnippets[snippetIdx]) return;

      const snippet = exp.codeSnippets[snippetIdx];
      const textArea = document.createElement('textarea');
      textArea.value = snippet.code;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(`${snippet.title} (${snippet.language}) copied to clipboard!`);
      } catch (err) {
        showToast('Unable to copy code automatically.', 'info');
      }
      document.body.removeChild(textArea);
    }

              </span>
              <span class="text-emerald-700 group-hover:translate-x-1 transition-transform inline-flex items-center gap-1.5">
                Open Experiment <i class="fa-solid fa-arrow-right"></i>
              </span>
            </div>
          </div>
        </article>
      `).join('');
    }

    function renderExperimentsGrid() {
      const grid = document.getElementById('experiments-grid');
      if (grid) {
        grid.innerHTML = renderExperimentCardsHtml();
      }
    }

    // =========================================================================
    // 9. RENDER EXPERIMENT DETAIL VIEW (DEDICATED PAGE WITH MULTI-CODE BLOCKS)
    // =========================================================================
    function renderExperimentDetailView(expId) {
      const expIndex = EXPERIMENTS.findIndex(e => e.id === expId);
      const exp = EXPERIMENTS[expIndex] || EXPERIMENTS[0];
      const prevExp = expIndex > 0 ? EXPERIMENTS[expIndex - 1] : null;
      const nextExp = expIndex < EXPERIMENTS.length - 1 ? EXPERIMENTS[expIndex + 1] : null;

      return `
        <div class="fade-in max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
          <!-- Breadcrumb & Back Navigation Bar -->
          <div class="flex flex-wrap items-center justify-between gap-3 mb-6 no-print">
            <nav class="flex items-center gap-2 text-xs sm:text-sm text-slate-500">
              <button onclick="navigateToHome()" class="hover:text-emerald-700 font-medium flex items-center gap-1.5 transition">
                <i class="fa-solid fa-house"></i>
                <span>Lab Index</span>
              </button>
              <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
              <span class="font-mono font-semibold text-slate-800">${exp.code}</span>
            </nav>

            <button onclick="navigateToHome()" class="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-800 border border-slate-300 text-xs sm:text-sm font-semibold shadow-sm transition inline-flex items-center gap-2">
              <i class="fa-solid fa-arrow-left text-emerald-600"></i>
              <span>Back to Experiments</span>
            </button>
          </div>

          <!-- Experiment Header Hero Banner -->
          <div class="bg-navy-900 circuit-pattern text-white rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-lg mb-8 print-shadow-none">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-mono text-xs font-bold px-3 py-1 rounded-lg bg-emerald-500 text-slate-950">
                  ${exp.code}
                </span>
                <span class="text-xs font-semibold px-3 py-1 rounded-lg bg-slate-800 text-cyan-300 border border-slate-700">
                  ${exp.category}
                </span>
                <span class="text-xs font-mono px-2.5 py-1 rounded-lg bg-slate-800/80 text-slate-300 border border-slate-700">
                  Mapped: ${exp.coMapped.join(', ')}
                </span>
              </div>
              <span class="text-xs text-slate-300 flex items-center gap-1.5">
                <i class="fa-regular fa-clock text-emerald-400"></i> Duration: ${exp.duration}
              </span>
            </div>

            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-3">
              ${exp.title}
            </h1>
            <p class="text-slate-300 text-sm sm:text-base max-w-3xl leading-relaxed mb-6">
              ${exp.summary}
            </p>

            <!-- Action Buttons: Download Lab Manual & Print/Save PDF -->
            <div class="flex flex-wrap items-center gap-3 pt-4 border-t border-slate-800 no-print">
              <button
                onclick="downloadLabManual(${exp.id})"
                class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-semibold shadow-lg shadow-emerald-600/25 transition inline-flex items-center gap-2"
              >
                <i class="fa-solid fa-file-arrow-down"></i>
                <span>Download Lab Manual (.HTML)</span>
              </button>

              <button
                onclick="downloadExperimentPdf(${exp.id})"
                class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-semibold transition inline-flex items-center gap-2"
              >
                <i class="fa-solid fa-print text-cyan-400"></i>
                <span>Print / Save as PDF</span>
              </button>

              <a
                href="#video-tutorial-section"
                class="px-4 py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-semibold transition inline-flex items-center gap-2"
              >
                <i class="fa-brands fa-youtube text-rose-500 text-base"></i>
                <span>Watch Video Tutorial</span>
              </a>
            </div>
          </div>

          <!-- Two-Column Layout for Objective & Tools Required -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- Objective Card (2/3 width) -->
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm print-shadow-none">
              <div class="flex items-center gap-2.5 mb-4">
                <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                  <i class="fa-solid fa-bullseye"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-900">1. Objective of the Experiment</h2>
              </div>
              <ul class="space-y-2.5 text-sm text-slate-700">
                ${exp.objectives.map(obj => `
                  <li class="flex items-start gap-2.5">
                    <i class="fa-solid fa-circle-check text-emerald-600 mt-1 text-xs shrink-0"></i>
                    <span>${obj}</span>
                  </li>
                `).join('')}
              </ul>
            </div>

            <!-- Tools Required Card (1/3 width) -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm print-shadow-none">
              <div class="flex items-center gap-2.5 mb-4">
                <div class="w-9 h-9 rounded-xl bg-cyan-50 text-cyan-600 flex items-center justify-center">
                  <i class="fa-solid fa-screwdriver-wrench"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-900">2. Tools Required</h2>
              </div>
              <div class="space-y-3">
                ${exp.tools.map(tool => `
                  <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/80 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-700 flex items-center justify-center shrink-0">
                      <i class="fa-solid ${tool.icon} text-xs text-emerald-600"></i>
                    </div>
                    <div>
                      <div class="text-xs font-bold text-slate-900">${tool.name}</div>
                      <div class="text-[11px] text-slate-500">${tool.role}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Theory, Circuit Diagram & Multiple Reference Code Blocks Section -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm mb-8 print-shadow-none">
            <div class="flex items-center justify-between gap-2.5 mb-5">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                  <i class="fa-solid fa-book-open"></i>
                </div>
                <h2 class="text-lg sm:text-xl font-bold text-slate-900">3. Theory, Schematic & Reference Code</h2>
              </div>
              <span class="font-mono text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 border border-slate-200">
                ${(exp.codeSnippets || []).length} Code File${(exp.codeSnippets || []).length === 1 ? '' : 's'}
              </span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <!-- Theory Explanation -->
              <div class="lg:col-span-7 text-sm text-slate-700 leading-relaxed">
                ${exp.theory}
              </div>

              <!-- SVG Circuit / Architecture Diagram -->
              <div class="lg:col-span-5 bg-slate-50 rounded-2xl border border-slate-200 p-4">
                <div class="text-[11px] font-mono uppercase tracking-wider text-slate-500 mb-2 text-center">
                  Reference Circuit / Architecture Diagram
                </div>
                ${exp.diagramSvg}
              </div>
            </div>

            <!-- Multiple Code Snippet Blocks with Individual Copy Buttons -->
            <div class="mt-6 space-y-4">
              ${(exp.codeSnippets || []).map((snip, idx) => `
                <div class="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950">
                  <div class="px-4 py-2.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                      <span class="font-mono text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 shrink-0">
                        #${idx + 1}
                      </span>
                      <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">
                        ${snip.language}
                      </span>
                      <span class="font-mono text-xs text-slate-300 truncate">${snip.title}</span>
                    </div>
                    <button
                      onclick="copyCodeSnippet(${exp.id}, ${idx})"
                      class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition inline-flex items-center gap-1.5 shrink-0 no-print"
                    >
                      <i class="fa-regular fa-copy text-emerald-400"></i>
                      <span>Copy Code</span>
                    </button>
                  </div>
                  <pre class="p-4 text-xs font-mono text-slate-200 overflow-x-auto leading-relaxed"><code>${snip.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Step-by-Step Procedure Section -->
          <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm mb-8 print-shadow-none">
            <div class="flex items-center gap-2.5 mb-5">
              <div class="w-9 h-9 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
                <i class="fa-solid fa-list-ol"></i>
              </div>
              <h2 class="text-lg sm:text-xl font-bold text-slate-900">4. Laboratory Execution Procedure</h2>
            </div>

            <ol class="space-y-3">
              ${exp.procedure.map((step, idx) => `
                <li class="flex items-start gap-3.5 p-3.5 rounded-xl bg-slate-50 border border-slate-200/70">
                  <span class="w-7 h-7 rounded-lg bg-slate-900 text-white font-mono text-xs font-bold flex items-center justify-center shrink-0">
                    ${idx + 1}
                  </span>
                  <span class="text-sm text-slate-700 leading-relaxed pt-0.5">${step}</span>
                </li>
              `).join('')}
            </ol>
          </div>

          <!-- Embedded YouTube Video Tutorial Section -->
          <div id="video-tutorial-section" class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm mb-8 no-print">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-5">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center">
                  <i class="fa-brands fa-youtube text-lg"></i>
                </div>
                <div>
                  <h2 class="text-lg sm:text-xl font-bold text-slate-900">5. Video Lecture & Simulation Walkthrough</h2>
                  <p class="text-xs text-slate-500">${exp.videoChannel}</p>
                </div>
              </div>
              <a
                href="https://www.youtube.com/results?search_query=${encodeURIComponent(exp.title + ' VLSI tutorial')}"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs font-semibold text-rose-600 hover:text-rose-700 inline-flex items-center gap-1.5"
              >
                <span>Open More Tutorials on YouTube</span>
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
            </div>

            <!-- Responsive 16:9 YouTube Iframe Container -->
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-inner">
              <iframe
                class="absolute inset-0 w-full h-full"
                src="https://www.youtube.com/embed/${exp.videoId}?rel=0"
                title="${exp.videoTitle}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>
            </div>

            <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div class="text-xs font-bold text-slate-900">${exp.videoTitle}</div>
                <p class="text-xs text-slate-600 mt-0.5">${exp.videoNotes}</p>
              </div>
              <button
                onclick="downloadLabManual(${exp.id})"
                class="shrink-0 px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition inline-flex items-center gap-2"
              >
                <i class="fa-solid fa-download text-emerald-400"></i>
                <span>Download Manual</span>
              </button>
            </div>
          </div>

          <!-- Previous / Next Experiment Navigation Footer -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-slate-200 no-print">
            ${prevExp ? `
              <button
                onclick="navigateToExperiment(${prevExp.id})"
                class="p-4 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 hover:border-emerald-400 text-left transition flex items-center gap-3.5 shadow-sm"
              >
                <div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-arrow-left"></i>
                </div>
                <div class="min-w-0">
                  <div class="text-[11px] font-mono font-semibold text-slate-400">PREVIOUS • ${prevExp.code}</div>
                  <div class="text-xs sm:text-sm font-bold text-slate-900 truncate">${prevExp.title}</div>
                </div>
              </button>
            ` : `<div></div>`}

            ${nextExp ? `
              <button
                onclick="navigateToExperiment(${nextExp.id})"
                class="p-4 rounded-2xl bg-white hover:bg-slate-50 border border-slate-200 hover:border-emerald-400 text-right transition flex items-center justify-end gap-3.5 shadow-sm"
              >
                <div class="min-w-0">
                  <div class="text-[11px] font-mono font-semibold text-emerald-600">NEXT • ${nextExp.code}</div>
                  <div class="text-xs sm:text-sm font-bold text-slate-900 truncate">${nextExp.title}</div>
                </div>
                <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-arrow-right"></i>
                </div>
              </button>
            ` : `
              <button
                onclick="navigateToHome()"
                class="p-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-right transition flex items-center justify-end gap-3.5 shadow-sm"
              >
                <div>
                  <div class="text-[11px] font-mono font-semibold text-emerald-200">ALL EXPERIMENTS COMPLETED</div>
                  <div class="text-xs sm:text-sm font-bold">Return to Lab Index</div>
                </div>
                <div class="w-9 h-9 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0">
                  <i class="fa-solid fa-house"></i>
                </div>
              </button>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. MAIN APPLICATION RENDER CONTROLLER
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (currentView.page === 'detail') {
        root.innerHTML = renderExperimentDetailView(currentView.expId);
      } else {
        root.innerHTML = renderHomeView();
      }
    }

    // Initialize Application on Load
    window.addEventListener('DOMContentLoaded', () => {
      syncHeaderAndFooter();
      renderApp();
    });
  </script>
</body>
</html>
